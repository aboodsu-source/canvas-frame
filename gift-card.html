<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كانفس فريم — بطاقة هدية</title>
<style>
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Black.ttf') format('truetype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --navy: #032b44;
    --gold: #c9a23c;
    --white: #ffffff;
    --muted: #8a9bb5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #b0b0b0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
    padding: 50px 20px;
    font-family: 'DG Tebian', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .label {
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: -30px;
  }

  /* ═══════════════ CARD ═══════════════ */
  .card {
    width: 91mm;
    height: 61mm;
    background: var(--white);
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 30px rgba(0,0,0,0.25);
    flex-shrink: 0;
  }

  /* Gold border frame */
  .card::before {
    content: '';
    position: absolute;
    top: 3mm; left: 3mm; right: 3mm; bottom: 3mm;
    border: 0.35mm solid var(--gold);
    pointer-events: none;
    z-index: 2;
  }

  /* Corner accents */
  .c { position: absolute; width: 8px; height: 8px; z-index: 3; }
  .c::before, .c::after { content: ''; position: absolute; background: var(--gold); }
  .c::before { width: 8px; height: 1px; }
  .c::after  { width: 1px; height: 8px; }
  .c.tl { top: 3mm; right: 3mm; }    .c.tl::before { top:0; right:0; }    .c.tl::after { top:0; right:0; }
  .c.tr { top: 3mm; left: 3mm;  }    .c.tr::before { top:0; left:0;  }    .c.tr::after { top:0; left:0;  }
  .c.bl { bottom: 3mm; right: 3mm; } .c.bl::before { bottom:0; right:0; } .c.bl::after { bottom:0; right:0; }
  .c.br { bottom: 3mm; left: 3mm;  } .c.br::before { bottom:0; left:0;  } .c.br::after { bottom:0; left:0;  }

  /* ═══════════════ FRONT ═══════════════ */
  .front .inner {
    position: absolute;
    inset: 6mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3mm;
    z-index: 1;
  }

  .front .logo {
    width: 32mm;
    height: auto;
  }

  .front .slogan {
    width: 22mm;
    height: auto;
  }

  .front .qr-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1mm;
    margin-top: 1mm;
  }

  .front .qr-box {
    width: 13mm;
    height: 13mm;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .front .qr-box canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .front .hint {
    font-size: 4pt;
    color: var(--muted);
    text-align: center;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* ═══════════════ BACK ═══════════════ */
  .back .inner {
    position: absolute;
    inset: 8mm;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1;
  }

  .back .lines-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8mm;
  }

  .back .line {
    border-bottom: 0.2mm solid var(--gold);
    opacity: 0.3;
    width: 100%;
    height: 0;
  }

  .back .url {
    font-size: 5pt;
    color: var(--muted);
    font-weight: 400;
    letter-spacing: 0.05em;
    margin-top: 5mm;
  }

  /* ═══════════════ PRINT ═══════════════ */
  @media print {
    body { background: none; margin: 0; padding: 0; gap: 0; }
    .label { display: none; }
    .card {
      box-shadow: none;
      page-break-after: always;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .card:last-child { page-break-after: avoid; }
  }

  @page {
    size: 91mm 61mm;
    margin: 0;
  }
</style>
</head>
<body>

<!-- ════════════════════ FRONT ════════════════════ -->
<p class="label">Front</p>
<div class="card front">
  <span class="c tl"></span><span class="c tr"></span>
  <span class="c bl"></span><span class="c br"></span>
  <div class="inner">
    <img src="logo.svg" class="logo" alt="CANVAS FRAME">
    <img src="slogan.svg" class="slogan" alt="أجمل لوحة فنية">
    <div class="qr-area">
      <div class="qr-box"><canvas id="qrCanvas"></canvas></div>
      <p class="hint">امسح الكود لزيارة قصتنا</p>
    </div>
  </div>
</div>

<!-- ════════════════════ BACK ════════════════════ -->
<p class="label">Back</p>
<div class="card back">
  <span class="c tl"></span><span class="c tr"></span>
  <span class="c bl"></span><span class="c br"></span>
  <div class="inner">
    <div class="lines-wrap">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <p class="url">CANVAS-FRAME.COM</p>
  </div>
</div>

<script src="qrcodegen.js"></script>
<script>
(function() {
  var url = 'https://aboodsu-source.github.io/canvas-frame/';
  var qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();

  var canvas = document.getElementById('qrCanvas');
  var ctx = canvas.getContext('2d');
  var modules = qr.getModuleCount();
  var cellSize = 500 / modules;
  canvas.width = 500;
  canvas.height = 500;

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 500, 500);

  ctx.fillStyle = 'rgba(3, 43, 68, 0.45)';
  for (var r = 0; r < modules; r++) {
    for (var c = 0; c < modules; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(
          Math.round(c * cellSize),
          Math.round(r * cellSize),
          Math.ceil(cellSize),
          Math.ceil(cellSize)
        );
      }
    }
  }
})();
</script>

</body>
</html>
