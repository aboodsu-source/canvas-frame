<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كانفس فريم — بطاقة هدية</title>
<style>
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Black.ttf') format('truetype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --navy: #1a2744;
    --gold: #c9a23c;
    --white: #ffffff;
    --muted: #8a9bb5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #d0d0d0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 20px;
    font-family: 'DG Tebian', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /*
   * ─── DIMENSION MAP ─────────────────────────────────────────
   *
   *   Card (trim):    85mm  × 55mm
   *   Bleed:           3mm  each side
   *   Artboard:       91mm  × 61mm
   *
   *   Gold border:     3mm  inset from artboard edge (= at trim line)
   *   Safe content:    5mm  inset from trim  (= 8mm from artboard edge)
   *
   *   FRONT — horizontal layout (inside 75mm × 45mm):
   *     ┌──────────────────────────────────────────────────┐
   *     │  ┌─────────┐  ┃  ┌────────────────────────────┐  │
   *     │  │         │  ┃  │  CANVAS FRAME              │  │
   *     │  │  QR     │  ┃  │  كانفس فريم                │  │
   *     │  │  CODE   │  ┃  │                            │  │
   *     │  │  38mm   │  ┃  │  ─── ✦ ───                │  │
   *     │  │         │  ┃  │  أجمل لوحة فنية            │  │
   *     │  │         │  ┃  │                            │  │
   *     │  └─────────┘  ┃  │  امسح الكود لزيارة قصتنا  │  │
   *     │               ┃  └────────────────────────────┘  │
   *     └──────────────────────────────────────────────────┘
   *
   *   BACK — handwriting area (inside same 75mm × 45mm):
   *     4 gold guide lines, spaced 9mm apart
   *     canvasframe.sa centered at bottom
   */

  .card {
    width: 91mm;
    height: 61mm;
    background: var(--white);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  /* Gold border — at trim line */
  .card::before {
    content: '';
    position: absolute;
    top: 3mm; left: 3mm; right: 3mm; bottom: 3mm;
    border: 0.4mm solid var(--gold);
    pointer-events: none;
    z-index: 2;
  }

  /* Corner accents */
  .c { position: absolute; width: 10px; height: 10px; z-index: 3; }
  .c::before, .c::after { content: ''; position: absolute; background: var(--gold); }
  .c::before { width: 10px; height: 1px; }
  .c::after  { width: 1px; height: 10px; }
  .c.tl { top: 3mm; right: 3mm; }    .c.tl::before { top:0; right:0; }    .c.tl::after { top:0; right:0; }
  .c.tr { top: 3mm; left: 3mm;  }    .c.tr::before { top:0; left:0;  }    .c.tr::after { top:0; left:0;  }
  .c.bl { bottom: 3mm; right: 3mm; } .c.bl::before { bottom:0; right:0; } .c.bl::after { bottom:0; right:0; }
  .c.br { bottom: 3mm; left: 3mm;  } .c.br::before { bottom:0; left:0;  } .c.br::after { bottom:0; left:0;  }

  /* ═══════════════ FRONT ═══════════════ */
  .front .inner {
    position: absolute;
    top: 8mm; left: 8mm; right: 8mm; bottom: 8mm;
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    gap: 0;
    z-index: 1;
  }

  /* Right column — brand */
  .front .brand-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 3mm;
  }

  .front .brand img {
    height: 14mm;
    width: auto;
    display: block;
  }

  .front .divider {
    display: flex;
    align-items: center;
    gap: 2mm;
    width: 80%;
    margin: 2.5mm 0;
  }
  .front .divider .ln { flex: 1; height: 0.3mm; background: var(--gold); }
  .front .divider .dot { color: var(--gold); font-size: 7px; line-height: 1; }

  .front .tagline {
    font-size: 6.5pt;
    color: var(--navy);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .front .qr-hint {
    margin-top: 2mm;
    font-size: 4.5pt;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
    font-weight: 400;
  }

  /* Center divider line */
  .front .vline {
    width: 0.3mm;
    height: 35mm;
    background: var(--gold);
    flex-shrink: 0;
    opacity: 0.5;
  }

  /* Left column — QR */
  .front .qr-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 3mm;
  }

  .front .qr-box {
    width: 38mm;
    height: 38mm;
    border: 0.3mm solid var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2mm;
    background: var(--white);
  }

  .front .qr-box canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ═══════════════ BACK ═══════════════ */
  .back .inner {
    position: absolute;
    top: 8mm; left: 8mm; right: 8mm; bottom: 8mm;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }

  .back .lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 9mm;
    padding-top: 8mm;
  }

  .back .line {
    border-bottom: 0.2mm solid var(--gold);
    opacity: 0.3;
    width: 100%;
    height: 0;
  }

  .back .url {
    text-align: center;
    font-size: 5pt;
    color: var(--muted);
    padding-bottom: 2mm;
    font-weight: 400;
    flex-shrink: 0;
  }

  /* ═══════════════ PRINT ═══════════════ */
  @media print {
    body { background: none; margin: 0; padding: 0; gap: 0; }
    .card {
      box-shadow: none;
      page-break-after: always;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color-adjust: exact;
    }
    .card:last-child { page-break-after: avoid; }
  }

  @page {
    size: 91mm 61mm;
    margin: 0;
  }
</style>
</head>
<body>

<!-- ════════════════════ FRONT ════════════════════ -->
<div class="card front">
  <span class="c tl"></span><span class="c tr"></span>
  <span class="c bl"></span><span class="c br"></span>
  <div class="inner">
    <!-- QR code — left side, large -->
    <div class="qr-col">
      <div class="qr-box">
        <canvas id="qrCanvas"></canvas>
      </div>
    </div>

    <!-- Vertical divider -->
    <div class="vline"></div>

    <!-- Brand — right side -->
    <div class="brand-col">
      <img src="Untitled-2.png" alt="كانفس فريم">
      <div class="divider">
        <span class="ln"></span>
        <span class="dot">✦</span>
        <span class="ln"></span>
      </div>
      <p class="tagline">أجمل لوحة فنية</p>
      <p class="qr-hint">امسح الكود لزيارة قصتنا</p>
    </div>
  </div>
</div>

<!-- ════════════════════ BACK ════════════════════ -->
<div class="card back">
  <span class="c tl"></span><span class="c tr"></span>
  <span class="c bl"></span><span class="c br"></span>
  <div class="inner">
    <div class="lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <p class="url">canvas-frame.com</p>
  </div>
</div>

    QrMode._getCharacterCountBits=function(e,t){var n=t;return e==QrMode.NUMERIC?[10,12,14][n-1]:e==QrMode.ALPHANUMERIC?[9,11,13][n-1]:e==QrMode.BYTE?[8,16,16][n-1]:e==QrMode.KANJI?[8,10,12][n-1]:0};
    QrMode._MODE_BIT_MODE=[0,0,0,1];
    function QrSegment(e,t,n){this._mode=e;this._data=t;this._bitLength=n}
    QrSegment.makeBytes=function(e){return new QrSegment(QrMode.BYTE,e,e.length*8)};
    QrSegment.prototype.getMode=function(){return this._mode};
    QrSegment.prototype.getData=function(){return this._data};
    function encodeURI(e){return e}
    return QrCode;
  })();

  var seg = QRC.QrSegment.makeBytes(
    'https://aboodsu-source.github.io/canvas-frame/'.split('').map(function(c){return c.charCodeAt(0)})
  );
  var qr = QRC.QrCode.encodeSegments([seg], QRC.QrCode.Ecc.MEDIUM);
  var cv = document.getElementById('qrCanvas');
  var ctx = cv.getContext('2d');
  var px = 500;
  cv.width = px; cv.height = px;
  var size = qr._size;
  var cell = px / size;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = '#1a2744';
  for (var r = 0; r < size; r++)
    for (var c = 0; c < size; c++)
      if (qr.getModule(r, c))
        ctx.fillRect(c * cell, r * cell, cell + 0.5, cell + 0.5);
})();
