<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كانفس فريم — بطاقة هدية</title>
<style>
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Black.ttf') format('truetype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --navy: #1a2744;
    --gold: #c9a23c;
    --white: #ffffff;
    --muted: #8a9bb5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #d0d0d0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 20px;
    font-family: 'DG Tebian', 'Segoe UI', Tahoma, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /*
   * ─── DIMENSION MAP ─────────────────────────────────────────
   *
   *   Card (trim):    85mm  × 55mm
   *   Bleed:           3mm  each side
   *   Artboard:       91mm  × 61mm
   *
   *   Gold border:     3mm  inset from artboard edge (= at trim line)
   *   Safe content:    5mm  inset from trim line  (= 8mm from artboard edge)
   *
   *   FRONT layout (inside 75mm × 45mm safe content area):
   *     Top pad:        5mm
   *     Logo:          12mm
   *     Gap:            3mm
   *     Divider:        1mm
   *     Gap:            3mm
   *     Brand text:     5mm
   *     [flex spacer]
   *     QR row:        14mm
   *     Bottom pad:     5mm
   *
   *   BACK layout (inside same safe area):
   *     Top pad:        8mm
   *     Lines:   4 × 8mm spacing  = 32mm
   *     Bottom pad:     5mm
   *     URL:            3mm
   */

  .card {
    width: 91mm;
    height: 61mm;
    background: var(--white);
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  /* Gold border — 0.4mm stroke, inset 3mm from artboard edge */
  .card::before {
    content: '';
    position: absolute;
    top: 3mm;
    left: 3mm;
    right: 3mm;
    bottom: 3mm;
    border: 0.4mm solid var(--gold);
    pointer-events: none;
    z-index: 2;
  }

  /* Corner accents — 10px L-shapes at border corners */
  .c { position: absolute; width: 10px; height: 10px; z-index: 3; }
  .c::before, .c::after { content: ''; position: absolute; background: var(--gold); }
  .c::before { width: 10px; height: 1px; }
  .c::after  { width: 1px; height: 10px; }
  .c.tl { top: 3mm; right: 3mm; } .c.tl::before { top:0; right:0; } .c.tl::after { top:0; right:0; }
  .c.tr { top: 3mm; left: 3mm;  } .c.tr::before { top:0; left:0;  } .c.tr::after { top:0; left:0;  }
  .c.bl { bottom: 3mm; right: 3mm; } .c.bl::before { bottom:0; right:0; } .c.bl::after { bottom:0; right:0; }
  .c.br { bottom: 3mm; left: 3mm;  } .c.br::before { bottom:0; left:0;  } .c.br::after { bottom:0; left:0;  }

  /* ─── FRONT ─── */
  .front .inner {
    position: absolute;
    top: 8mm; left: 8mm; right: 8mm; bottom: 8mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
  }

  .front .brand { margin-top: 5mm; flex-shrink: 0; }
  .front .brand img { height: 12mm; width: auto; display: block; }

  .front .divider {
    display: flex; align-items: center; gap: 3mm;
    width: 55%; margin-top: 3mm; flex-shrink: 0;
  }
  .front .divider .ln { flex: 1; height: 0.3mm; background: var(--gold); }
  .front .divider .dot { color: var(--gold); font-size: 7px; line-height: 1; }

  .front .tagline {
    margin-top: 3mm;
    font-size: 7pt;
    color: var(--navy);
    font-weight: 700;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }

  .front .qr-row {
    margin-top: auto;
    margin-bottom: 5mm;
    display: flex;
    align-items: center;
    gap: 3.5mm;
    flex-shrink: 0;
  }

  .front .qr-label {
    color: var(--muted);
    font-size: 5pt;
    line-height: 1.6;
    text-align: right;
    font-weight: 400;
  }

  .front .qr-box {
    width: 12mm;
    height: 12mm;
    border: 0.3mm solid var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1mm;
    flex-shrink: 0;
  }

  .front .qr-box canvas { width: 100%; height: 100%; display: block; }

  /* ─── BACK ─── */
  .back .inner {
    position: absolute;
    top: 8mm; left: 8mm; right: 8mm; bottom: 8mm;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }

  .back .lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 8mm;
    padding-top: 8mm;
  }

  .back .line {
    border-bottom: 0.2mm solid var(--gold);
    opacity: 0.35;
    width: 100%;
    height: 0;
  }

  .back .url {
    text-align: center;
    font-size: 5pt;
    color: var(--muted);
    padding-bottom: 2mm;
    font-weight: 400;
    flex-shrink: 0;
  }

  /* ─── PRINT ─── */
  @media print {
    body { background: none; margin: 0; padding: 0; gap: 0; }
    .card {
      box-shadow: none;
      page-break-after: always;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      color-adjust: exact;
    }
    .card:last-child { page-break-after: avoid; }
  }

  @page {
    size: 91mm 61mm;
    margin: 0;
  }
</style>
</head>
<body>

<!-- ════════════════════ FRONT ════════════════════ -->
<div class="card front">
  <span class="c tl"></span><span class="c tr"></span>
  <span class="c bl"></span><span class="c br"></span>
  <div class="inner">
    <div class="brand">
      <img src="Untitled-2.png" alt="كانفس فريم">
    </div>
    <div class="divider">
      <span class="ln"></span>
      <span class="dot">✦</span>
      <span class="ln"></span>
    </div>
    <p class="tagline">أجمل لوحة فنية</p>
    <div class="qr-row">
      <div class="qr-label">امسح الكود<br>لزيارة قصتنا</div>
      <div class="qr-box"><canvas id="qrCanvas"></canvas></div>
    </div>
  </div>
</div>

<!-- ════════════════════ BACK ════════════════════ -->
<div class="card back">
  <span class="c tl"></span><span class="c tr"></span>
  <span class="c bl"></span><span class="c br"></span>
  <div class="inner">
    <div class="lines">
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <p class="url">canvasframe.sa</p>
  </div>
</div>

<script>

  // Render
  var seg = QRC.QrSegment.makeBytes(
    'https://aboodsu-source.github.io/canvas-frame/'.split('').map(function(c){return c.charCodeAt(0)})
  );
  var qr = QRC.QrCode.encodeSegments([seg], QRC.QrCode.Ecc.MEDIUM);
  var cv = document.getElementById('qrCanvas');
  var ctx = cv.getContext('2d');
  var px = 500;
  cv.width = px; cv.height = px;
  var size = qr._size;
  var cell = px / size;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = '#1a2744';
  for (var r = 0; r < size; r++)
    for (var c = 0; c < size; c++)

</script>

</body>
</html>
