<style>
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Black.ttf') format('truetype');
    font-weight: 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Bold.ttf') format('truetype');
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'DG Tebian';
    src: url('fonts/DGTebian-Regular.ttf') format('truetype');
    font-weight: 400; font-style: normal; font-display: swap;
  }

  :root {
    /* brand */
    --navy:       #032b44;
    --gold:       #c9a23c;
    /* ground */
    --paper:      #e8e7e3;
    --card:       #f6f5f3;
    --ink:        #14181c;
    --ink-soft:   #5c6269;
    --rule:       #cfcdc8;
    /* the one action they came for — kept off --navy so dark mode can't invert it */
    --lead-bg:    #032b44;
    --lead-fg:    #f6f5f3;
    --lead-soft:  rgba(255,255,255,.7);

    --mono: ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --ar: 'DG Tebian', 'Segoe UI', Tahoma, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    #101418;
      --card:     #171c22;
      --ink:      #e8eaec;
      --ink-soft: #8b939b;
      --rule:     #262d35;
      --navy:     #e8eaec;
      --lead-bg:  #e8eaec;
      --lead-fg:  #101418;
      --lead-soft: rgba(16,20,24,.62);
    }
  }
  :root[data-theme="dark"] {
    --paper: #101418; --card: #171c22; --ink: #e8eaec;
    --ink-soft: #8b939b; --rule: #262d35; --navy: #e8eaec;
    --lead-bg: #e8eaec; --lead-fg: #101418; --lead-soft: rgba(16,20,24,.62);
  }
  :root[data-theme="light"] {
    --paper: #e8e7e3; --card: #f6f5f3; --ink: #14181c;
    --ink-soft: #5c6269; --rule: #cfcdc8; --navy: #032b44;
    --lead-bg: #032b44; --lead-fg: #f6f5f3; --lead-soft: rgba(255,255,255,.7);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ar);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100svh;
    padding: 0 20px;
  }

  .wrap { width: 100%; max-width: 400px; }

  /* ── Utility face: every Latin string on this page is stamped, not set ── */
  .stamp {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }

  /* ── Statement ──
     No logo lockup above it on purpose: they just scanned a badge with the
     mark on it. Repeating it here costs a screenful and tells them nothing. */
  .statement { padding: 64px 0 36px; }

  /* two fragments, their rhythm: the first is pride, the second is the invitation.
     weight and colour carry that split — don't collapse them into one line. */
  h1 {
    font-size: clamp(30px, 9vw, 38px);
    font-weight: 900;
    line-height: 1.35;
    letter-spacing: -0.01em;
    color: var(--navy);
  }

  h1 span {
    display: block;
    font-weight: 400;
    color: var(--ink-soft);
  }

  .statement .stamp { display: block; margin-bottom: 14px; }

  /* ── Actions ── */
  .actions { display: grid; gap: 10px; }

  .action {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
    transition: border-color .18s, transform .18s;
  }

  .action:hover,
  .action:focus-visible { border-color: var(--gold); transform: translateX(-2px); }

  .action:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .action-ar { font-size: 17px; font-weight: 700; color: var(--navy); }
  .action .stamp { display: block; margin-top: 1px; }

  .arrow {
    width: 22px; height: 22px;
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.5;
    transition: transform .18s;
  }
  .action:hover .arrow { transform: translateX(-4px); }

  /* the one action they came for */
  .action--lead {
    background: var(--lead-bg);
    border-color: var(--lead-bg);
  }
  .action--lead .action-ar { color: var(--lead-fg); }
  .action--lead .stamp { color: var(--lead-soft); }

  /* ── Social ── */
  .social {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 32px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
  }

  .social a {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border: 1px solid var(--rule);
    border-radius: 4px;
    transition: border-color .18s, background .18s;
  }
  .social a:hover, .social a:focus-visible { border-color: var(--gold); background: var(--card); }
  .social a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .social svg { width: 18px; height: 18px; fill: var(--ink-soft); }
  .social a:hover svg { fill: var(--navy); }

  footer {
    text-align: center;
    padding: 30px 0 40px;
    display: grid;
    gap: 6px;
  }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--gold); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
